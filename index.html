<!DOCTYPE html>
<html lang="hu">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Barcelona – Látnivalók</title>
    <meta
      name="description"
      content="Barcelona híres látnivalói interaktív térképen – személyes úti tervhez."
    />

    <!-- Leaflet CSS (unpkg CDN) -->
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      crossorigin=""
    />
    <link rel="stylesheet" href="assets/css/style.css" />
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="index.html">
        <span class="dot"></span>
        <span class="brand-text">Barcelona – Látnivalók</span>
      </a>
      <nav class="nav-links">
        <button
          id="mobile-toggle"
          class="mobile-toggle"
          type="button"
          aria-label="Lista mutatása/elrejtése"
        >
          ☰ Lista
        </button>
        <a href="index.html" class="active">Térkép</a>
        <a href="itinerary.html">Útiterv</a>
      </nav>
    </header>

    <div class="layout">
      <aside class="sidebar" id="sidebar">
        <div class="sidebar-top">
          <h1>Látnivalók</h1>
          <p>Kattints egy helyre a listában vagy a térképen.</p>
          <div class="search-wrap">
            <span class="search-icon" aria-hidden="true">🔍</span>
            <input
              id="search"
              type="search"
              placeholder="Keresés név szerint…"
              autocomplete="off"
              aria-label="Látnivaló keresése"
            />
          </div>
          <div class="legend" id="legend" aria-label="Jelmagyarázat"></div>
        </div>
        <div class="sight-list" id="sight-list"></div>
        <div class="no-results" id="no-results" style="display: none">
          Nincs a keresésnek megfelelő találat.
        </div>
      </aside>

      <div id="map"></div>
    </div>

    <!-- Leaflet JS (unpkg CDN) -->
    <script
      src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
      crossorigin=""
    ></script>
    <script src="assets/js/sights.js"></script>
    <script src="assets/js/map.js"></script>
  </body>
</html>
